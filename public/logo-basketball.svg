<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Basketball body -->
  <circle cx="100" cy="80" r="60" fill="#f97316" stroke="#ea580c" stroke-width="3"/>

  <!-- Basketball lines -->
  <path d="M40 80 Q100 60 160 80" stroke="#1e293b" stroke-width="3" fill="none"/>
  <path d="M40 80 Q100 100 160 80" stroke="#1e293b" stroke-width="3" fill="none"/>
  <line x1="100" y1="20" x2="100" y2="140" stroke="#1e293b" stroke-width="3"/>
  <path d="M60 30 Q100 80 60 130" stroke="#1e293b" stroke-width="3" fill="none"/>
  <path d="M140 30 Q100 80 140 130" stroke="#1e293b" stroke-width="3" fill="none"/>

  <!-- Angry eyebrows -->
  <path d="M70 60 L90 70" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <path d="M130 60 L110 70" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="80" cy="75" r="8" fill="#1e293b"/>
  <circle cx="120" cy="75" r="8" fill="#1e293b"/>

  <!-- Gritting teeth mouth -->
  <rect x="75" y="95" width="50" height="20" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="95" x2="80" y2="115" stroke="#1e293b" stroke-width="2"/>
  <line x1="88" y1="95" x2="88" y2="115" stroke="#1e293b" stroke-width="2"/>
  <line x1="96" y1="95" x2="96" y2="115" stroke="#1e293b" stroke-width="2"/>
  <line x1="104" y1="95" x2="104" y2="115" stroke="#1e293b" stroke-width="2"/>
  <line x1="112" y1="95" x2="112" y2="115" stroke="#1e293b" stroke-width="2"/>
  <line x1="120" y1="95" x2="120" y2="115" stroke="#1e293b" stroke-width="2"/>

  <!-- Sweat drops -->
  <ellipse cx="50" cy="50" rx="4" ry="6" fill="#60a5fa"/>
  <ellipse cx="155" cy="65" rx="4" ry="6" fill="#60a5fa"/>

  <!-- Arms -->
  <line x1="40" y1="80" x2="15" y2="100" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="80" x2="185" y2="100" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

  <!-- Hands (gloves) -->
  <circle cx="10" cy="105" r="12" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <circle cx="190" cy="105" r="12" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>

  <!-- Money in hands - left -->
  <rect x="-8" y="115" width="25" height="15" rx="2" fill="#22c55e"/>
  <rect x="-5" y="118" width="25" height="15" rx="2" fill="#16a34a"/>
  <rect x="-2" y="121" width="25" height="15" rx="2" fill="#22c55e"/>

  <!-- Money in hands - right -->
  <rect x="178" y="115" width="25" height="15" rx="2" fill="#22c55e"/>
  <rect x="181" y="118" width="25" height="15" rx="2" fill="#16a34a"/>
  <rect x="184" y="121" width="25" height="15" rx="2" fill="#22c55e"/>

  <!-- Text -->
  <text x="100" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" font-style="italic" fill="#1e293b">Red Rocks Crew</text>
</svg>
